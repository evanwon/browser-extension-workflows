name: Test Pull Request (Reusable)

on:
  workflow_call:
    inputs:
      lint-warnings-as-errors:
        description: 'Pass --warnings-as-errors to web-ext lint'
        type: boolean
        default: false
      validate-versions:
        description: 'Run extension-validate-versions step'
        type: boolean
        default: true
      security-audit-strict:
        description: 'Hard-fail on security audit (vs continue-on-error)'
        type: boolean
        default: false
      upload-coverage:
        description: 'Upload coverage to Codecov'
        type: boolean
        default: false
      chrome-enabled:
        description: 'Enable Chrome build validation in PR checks'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Validate version consistency
      if: inputs.validate-versions
      run: npx extension-validate-versions

    - name: Security audit (strict)
      if: inputs.security-audit-strict
      run: |
        npm audit --audit-level=moderate || {
          echo "::warning::Security vulnerabilities found! Run 'npm audit' locally for details."
          npm audit --audit-level=moderate --json > audit-results.json
          exit 1
        }

    - name: Security audit (lenient)
      if: "!inputs.security-audit-strict"
      continue-on-error: true
      run: |
        npm audit --audit-level=moderate || {
          echo "::warning::Security vulnerabilities found! Run 'npm audit' locally for details."
        }

    - name: Run tests with coverage
      run: npm run test:ci

    # The web-ext that build-release lints and signs with, from this workflow's own commit
    - name: Checkout build tools
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .release-tools
        sparse-checkout: release-tools
        persist-credentials: false

    - name: Install build tools
      run: |
        npm ci --ignore-scripts --no-audit --no-fund --prefix .release-tools/release-tools/web-ext
        echo "$PWD/.release-tools/release-tools/web-ext/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run linting
      run: |
        if [ "${{ inputs.lint-warnings-as-errors }}" == "true" ]; then
          web-ext lint --source-dir=src --warnings-as-errors
        else
          web-ext lint --source-dir=src
        fi

    - name: Chrome - Build extension
      if: inputs.chrome-enabled
      run: npm run build:chrome

    - name: Chrome - Validate build
      if: inputs.chrome-enabled
      run: |
        test -f build/chrome/service-worker.js
        test -f build/chrome/manifest.json
        node -e "
          const m = JSON.parse(require('fs').readFileSync('build/chrome/manifest.json', 'utf8'));
          if (m.manifest_version !== 3) throw new Error('Not MV3');
          console.log('Chrome build validated');
        "

    - name: Upload coverage reports
      if: inputs.upload-coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        file: ./coverage/lcov.info
        flags: unittests
        fail_ci_if_error: false
