name: Build and Release (Reusable)

on:
  workflow_call:
    inputs:
      extension-name:
        description: 'Extension name for artifact naming (e.g. fancy-links)'
        type: string
        required: true
      extension-display-name:
        description: 'Display name for release titles (e.g. Fancy Links)'
        type: string
        required: true
      extension-description:
        description: 'One-line description for release notes'
        type: string
        required: true
      manifest-version:
        description: 'Expected manifest_version (2 or 3)'
        type: number
        default: 3
      lint-warnings-as-errors:
        description: 'Pass --warnings-as-errors to web-ext lint'
        type: boolean
        default: false
      validate-tag-matches-manifest:
        description: 'Verify git tag matches manifest version_name'
        type: boolean
        default: true
      amo-submission-enabled:
        description: 'Whether AMO listed submission is enabled (caller passes vars.AMO_SUBMISSION_ENABLED)'
        type: boolean
        default: false
      issues-url:
        description: 'GitHub issues URL for pre-release notes'
        type: string
        required: true
      amo-url:
        description: 'AMO listing URL (empty string to omit from release notes)'
        type: string
        default: ''
      firefox-min-version:
        description: 'Minimum Firefox version for release notes footer'
        type: string
        default: '109+'
      permissions-description:
        description: 'Permissions list for release notes footer'
        type: string
        required: true
      create-release:
        description: 'Create GitHub release (from workflow_dispatch passthrough)'
        type: boolean
        default: false
      submit-to-amo:
        description: 'Submit to AMO (from workflow_dispatch passthrough)'
        type: boolean
        default: false
      channel:
        description: 'AMO channel (from workflow_dispatch passthrough)'
        type: string
        default: 'listed'
      version-notes:
        description: 'Optional AMO submission notes (from workflow_dispatch passthrough; not sent to AMO yet)'
        type: string
        default: ''
      dry-run:
        description: 'Build, then check the store keys in the release environment; sign, submit and release nothing'
        type: boolean
        default: false
      chrome-enabled:
        description: 'Enable Chrome build, validation, and packaging'
        type: boolean
        default: false
      chrome-build-dir:
        description: 'Where Chrome build output lives'
        type: string
        default: 'build/chrome'
      cws-submission-enabled:
        description: 'Enable Chrome Web Store submission (mirrors amo-submission-enabled pattern)'
        type: boolean
        default: false
      cws-extension-id:
        description: 'Chrome Web Store extension ID'
        type: string
        default: ''
      chrome-min-version:
        description: 'Minimum Chrome version for release notes footer'
        type: string
        default: '102+'
    # Callers keep these in their `release` environment and pass each by name (`AMO_API_KEY: ${{ secrets.AMO_API_KEY }}`).
    # A secret that isn't passed is empty here, even if the environment has it; one passed by name resolves to the
    # environment's value in the release job, and to nothing in the build job, which has no environment.
    secrets:
      AMO_API_KEY:
        required: false
      AMO_API_SECRET:
        required: false
      CWS_CLIENT_ID:
        required: false
      CWS_CLIENT_SECRET:
        required: false
      CWS_REFRESH_TOKEN:
        required: false

# Two jobs so the store keys never share a runner with third-party code. `build` runs npm ci, the tests and web-ext
# lint/build (hundreds of npm packages, any of which could tamper with later steps in its job) and holds no secrets.
# `release` runs only the store tools, installed from the lockfiles in release-tools/, and gets the keys from the
# caller's `release` environment, which only `v*` tags can deploy to. It signs its own checkout of src/ rather than the
# build job's output, so nothing the build job ran can change what Mozilla signs. The Chrome package does come from the
# build job, because the caller's build script makes it.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.release_type.outputs.is_prerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 50
        persist-credentials: false

    - name: Fetch tags for changelog generation
      run: git fetch --tags origin

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Validate version consistency
      run: npx extension-validate-versions

    - name: Security audit
      run: |
        # Hard-fail on production dependency vulnerabilities
        echo "Checking production dependencies..."
        npm audit --omit=dev --audit-level=moderate || {
          echo "::error::Production dependency vulnerabilities found! Run 'npm audit --omit=dev' locally."
          exit 1
        }

        # Warn (but don't fail) on dev-only dependency vulnerabilities
        echo "Checking dev dependencies..."
        npm audit --audit-level=moderate || {
          echo "::warning::Dev dependency vulnerabilities found. Run 'npm audit' locally for details."
          echo "These are in dev/test tooling only and do not affect the shipped extension."
        }

    - name: Run tests with coverage
      run: npm run test:ci

    # The same web-ext the release job signs with, from this workflow's own commit
    - name: Checkout build tools
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .release-tools
        sparse-checkout: release-tools
        persist-credentials: false

    - name: Install build tools
      run: |
        npm ci --ignore-scripts --no-audit --no-fund --prefix .release-tools/release-tools/web-ext
        echo "$PWD/.release-tools/release-tools/web-ext/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Validate manifest
      run: |
        node -e "
          const manifest = JSON.parse(require('fs').readFileSync('src/manifest.json', 'utf8'));
          console.log('Extension:', manifest.name, 'v' + manifest.version);
          if (!manifest.version) throw new Error('No version in manifest');
          if (manifest.manifest_version !== ${{ inputs.manifest-version }}) {
            throw new Error('Expected Manifest V${{ inputs.manifest-version }} but found V' + manifest.manifest_version);
          }
        "

    - name: Extract version
      id: get_version
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          # Extract from tag
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        else
          # Extract from manifest.json for manual builds
          version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/manifest.json', 'utf8')).version)")
          echo "version=$version" >> $GITHUB_OUTPUT
        fi

        # Also extract version_name if present (for pre-release detection)
        version_name=$(node -e "const m = JSON.parse(require('fs').readFileSync('src/manifest.json', 'utf8')); console.log(m.version_name || m.version)")
        echo "version_name=$version_name" >> $GITHUB_OUTPUT

    - name: Verify tag matches manifest
      if: github.event_name == 'push' && inputs.validate-tag-matches-manifest
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        MANIFEST_VERSION="${{ steps.get_version.outputs.version_name }}"
        if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
          echo "::error::Tag v${TAG_VERSION} does not match manifest version_name (${MANIFEST_VERSION})"
          echo "Run 'npm run version:bump' to ensure tag and manifest are in sync."
          exit 1
        fi
        echo "Tag v${TAG_VERSION} matches manifest version_name"

    - name: Determine release type
      id: release_type
      run: |
        # Check version_name for pre-release indicators
        VERSION_NAME="${{ steps.get_version.outputs.version_name }}"
        VERSION="${{ steps.get_version.outputs.version }}"

        # Check if version_name contains pre-release suffix (rc, beta, alpha)
        if [[ "$VERSION_NAME" =~ -(rc|beta|alpha)[0-9]*$ ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
          echo "Pre-release detected: $VERSION_NAME"
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
          echo "Stable release detected: $VERSION"
        fi

    - name: Firefox - Lint extension
      run: |
        echo "Firefox: Linting extension with web-ext..."
        if [ "${{ inputs.lint-warnings-as-errors }}" == "true" ]; then
          web-ext lint --source-dir=src --warnings-as-errors
        else
          web-ext lint --source-dir=src
        fi

    - name: Firefox - Build extension
      run: |
        echo "Firefox: Building extension with web-ext..."
        web-ext build --source-dir=src --artifacts-dir=dist/firefox --overwrite-dest

    - name: Chrome - Build extension
      if: inputs.chrome-enabled
      run: npm run build:chrome

    - name: Chrome - Validate build
      if: inputs.chrome-enabled
      run: |
        test -f ${{ inputs.chrome-build-dir }}/service-worker.js
        test -f ${{ inputs.chrome-build-dir }}/manifest.json
        node -e "
          const m = JSON.parse(require('fs').readFileSync('${{ inputs.chrome-build-dir }}/manifest.json', 'utf8'));
          if (m.manifest_version !== 3) throw new Error('Chrome manifest must be MV3');
          if (!m.background.service_worker) throw new Error('Chrome must use service worker');
          console.log('Chrome build validated: MV3 with service worker');
        "

    - name: Chrome - Create ZIP
      if: inputs.chrome-enabled
      run: |
        EXT_NAME="${{ inputs.extension-name }}"
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p dist/chrome
        cd ${{ inputs.chrome-build-dir }}
        zip -r "$GITHUB_WORKSPACE/dist/chrome/${EXT_NAME}-chrome-v${VERSION}.zip" .

    - name: Generate changelog
      run: |
        CURRENT_VERSION="${{ steps.get_version.outputs.version_name }}"
        IS_PRERELEASE="${{ steps.release_type.outputs.is_prerelease }}"
        CHANGELOG=dist/changelog.md
        mkdir -p dist

        # Function to check if a tag is a pre-release
        is_prerelease_tag() {
          local tag=$1
          local version=${tag#v}
          if [[ "$version" =~ -(rc|beta|alpha)[0-9]*$ ]]; then
            return 0
          else
            return 1
          fi
        }

        # Get all tags sorted by version
        all_tags=$(git tag -l --sort=-version:refname)

        # Find the last stable release
        echo "Finding last stable release..."
        previous_stable=""
        for tag in $all_tags; do
          if [ "$IS_PRERELEASE" == "false" ] && [ "$tag" == "${{ github.ref_name }}" ]; then
            continue
          fi
          if ! is_prerelease_tag "$tag"; then
            previous_stable=$tag
            echo "Found last stable release: $previous_stable"
            break
          fi
        done

        # Generate the changelog
        if [ -n "$previous_stable" ]; then
          echo "Generating changelog from $previous_stable to HEAD..."

          if [ "$IS_PRERELEASE" == "true" ]; then
            echo "### Changes in this pre-release (since stable $previous_stable)" >> $CHANGELOG
          else
            echo "### Changes since $previous_stable" >> $CHANGELOG
          fi

          commit_count=$(git rev-list --count $previous_stable..HEAD)
          echo "" >> $CHANGELOG
          echo "_${commit_count} commits since last stable release_" >> $CHANGELOG
          echo "" >> $CHANGELOG

          git log --pretty=format:"- %s (%h)" $previous_stable..HEAD >> $CHANGELOG
          echo "" >> $CHANGELOG
        else
          echo "No previous stable release found, generating initial release notes..."
          echo "## Initial Release" >> $CHANGELOG
          echo "First official release of ${{ inputs.extension-display-name }}." >> $CHANGELOG
          echo "" >> $CHANGELOG
          echo "### Features" >> $CHANGELOG
          git log --pretty=format:"- %s (%h)" --reverse >> $CHANGELOG
          echo "" >> $CHANGELOG
        fi

    # The unsigned builds and changelog, for the release job and for anyone downloading a manual build
    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: extension-v${{ steps.get_version.outputs.version }}
        path: dist/
        if-no-files-found: error
        retention-days: 30

  release:
    name: Sign and release
    needs: build
    # A manual run that asks for nothing stops after the build, without touching the keys
    if: github.event_name == 'push' || inputs.dry-run || inputs.submit-to-amo || inputs.create-release
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    env:
      EXT_NAME: ${{ inputs.extension-name }}
      VERSION: ${{ needs.build.outputs.version }}
      IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
      CWS_UPLOAD: ${{ inputs.chrome-enabled && inputs.cws-submission-enabled }}

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Check the store keys (dry run)
      if: inputs.dry-run
      env:
        AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
        AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
        CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
        CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      # Read-only calls: AMO's profile endpoint, and Google's token exchange. Nothing is uploaded.
      run: |
        node --input-type=module <<'EOF'
        import crypto from 'node:crypto';
        const env = process.env;
        let failed = false;
        const fail = (message) => { console.log(`::error::${message}`); failed = true; };

        if (!env.AMO_API_KEY || !env.AMO_API_SECRET) {
          fail('AMO_API_KEY and AMO_API_SECRET are not set in the release environment');
        } else {
          const part = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const iat = Math.floor(Date.now() / 1000);
          const claims = { iss: env.AMO_API_KEY, jti: crypto.randomUUID(), iat, exp: iat + 60 };
          const body = `${part({ alg: 'HS256', typ: 'JWT' })}.${part(claims)}`;
          const jwt = `${body}.${crypto.createHmac('sha256', env.AMO_API_SECRET).update(body).digest('base64url')}`;
          const res = await fetch('https://addons.mozilla.org/api/v5/accounts/profile/', {
            headers: { Authorization: `JWT ${jwt}` },
          });
          if (res.ok) console.log('AMO accepted the keys');
          else fail(`AMO refused the keys: HTTP ${res.status} ${await res.text()}`);
        }

        if (env.CWS_UPLOAD === 'true') {
          if (!env.CWS_CLIENT_ID || !env.CWS_CLIENT_SECRET || !env.CWS_REFRESH_TOKEN) {
            fail('CWS_CLIENT_ID, CWS_CLIENT_SECRET and CWS_REFRESH_TOKEN are not set in the release environment');
          } else {
            const res = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              body: new URLSearchParams({
                client_id: env.CWS_CLIENT_ID,
                client_secret: env.CWS_CLIENT_SECRET,
                refresh_token: env.CWS_REFRESH_TOKEN,
                grant_type: 'refresh_token',
              }),
            });
            if (res.ok) console.log('Google accepted the Chrome Web Store keys');
            else fail(`Google refused the Chrome Web Store keys: HTTP ${res.status}`);
          }
        }

        process.exit(failed ? 1 : 0);
        EOF

    - name: Checkout code
      if: "!inputs.dry-run"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Checkout release tools
      if: "!inputs.dry-run"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .release-tools
        sparse-checkout: release-tools
        persist-credentials: false

    - name: Install release tools
      if: "!inputs.dry-run"
      run: |
        npm ci --ignore-scripts --no-audit --no-fund --prefix .release-tools/release-tools/web-ext
        echo "$PWD/.release-tools/release-tools/web-ext/node_modules/.bin" >> "$GITHUB_PATH"
        if [ "$CWS_UPLOAD" == "true" ]; then
          npm ci --ignore-scripts --no-audit --no-fund --prefix .release-tools/release-tools/chrome-webstore-upload
          echo "$PWD/.release-tools/release-tools/chrome-webstore-upload/node_modules/.bin" >> "$GITHUB_PATH"
        fi

    - name: Download build
      if: "!inputs.dry-run"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: extension-v${{ needs.build.outputs.version }}
        path: dist

    - name: Firefox - Determine AMO submission
      if: "!inputs.dry-run"
      id: amo_config
      env:
        EVENT: ${{ github.event_name }}
        SUBMIT_TO_AMO: ${{ inputs.submit-to-amo }}
        CHANNEL: ${{ inputs.channel }}
        AMO_SUBMISSION_ENABLED: ${{ inputs.amo-submission-enabled }}
      run: |
        if [[ "$IS_PRERELEASE" == "true" ]]; then
          # Pre-releases never go to AMO listed channel
          channel=unlisted
        elif [[ "$EVENT" == "workflow_dispatch" && "$SUBMIT_TO_AMO" == "true" ]]; then
          channel=$CHANNEL
        elif [[ "$EVENT" == "push" && "$AMO_SUBMISSION_ENABLED" == "true" ]]; then
          channel=listed
        else
          channel=unlisted
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "AMO channel: $channel (event $EVENT, pre-release $IS_PRERELEASE, AMO submission enabled $AMO_SUBMISSION_ENABLED)"

    - name: Firefox - Submit to AMO (listed channel)
      if: steps.amo_config.outputs.channel == 'listed'
      env:
        WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
        WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      run: |
        if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
          echo "::error::AMO credentials not configured. Set AMO_API_KEY and AMO_API_SECRET in the release environment."
          exit 1
        fi

        echo "Firefox: Submitting to AMO for public distribution..."

        # AMO reviewers get the source of the commit being released (required for listed submissions)
        git archive -o "$RUNNER_TEMP/source-code.zip" HEAD

        web-ext sign --source-dir=src --artifacts-dir=dist-amo \
          --channel=listed \
          --upload-source-code="$RUNNER_TEMP/source-code.zip" \
          --timeout=300000

        echo "Successfully submitted to AMO for review"
        echo "amo_submitted=true" >> $GITHUB_ENV

    - name: Firefox - Sign extension (unlisted/self-distribution)
      if: steps.amo_config.outputs.channel == 'unlisted'
      env:
        WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
        WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      run: |
        if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
          echo "AMO credentials not configured. Skipping signing."
          echo "Extension will be unsigned (requires Developer Edition or temporary installation)"
          exit 0
        fi

        echo "Firefox: Signing extension for self-distribution..."
        web-ext sign --source-dir=src --artifacts-dir=dist-signed \
          --channel=unlisted \
          --timeout=300000

    - name: Firefox - Get build artifact
      if: "!inputs.dry-run"
      id: get_firefox_artifact
      run: |
        # Check for AMO submitted version, then signed version, then fall back to the build job's unsigned one
        if [ "${{ env.amo_submitted }}" == "true" ] && [ -d "dist-amo" ] && [ "$(ls -A dist-amo/*.xpi 2>/dev/null)" ]; then
          filename=$(ls dist-amo/*.xpi | head -1 | xargs basename)
          filepath="dist-amo/$filename"
          echo "signed=amo" >> $GITHUB_OUTPUT
        elif [ -d "dist-signed" ] && [ "$(ls -A dist-signed/*.xpi 2>/dev/null)" ]; then
          filename=$(ls dist-signed/*.xpi | head -1 | xargs basename)
          filepath="dist-signed/$filename"
          echo "signed=true" >> $GITHUB_OUTPUT
        else
          filename=$(ls dist/firefox/*.zip | head -1 | xargs basename)
          filepath="dist/firefox/$filename"
          echo "signed=false" >> $GITHUB_OUTPUT
        fi
        echo "filename=$filename" >> $GITHUB_OUTPUT
        echo "filepath=$filepath" >> $GITHUB_OUTPUT
        echo "Found Firefox artifact: $filename (signed: $([ -d dist-signed ] && echo 'yes' || echo 'no'))"

    - name: Chrome - Submit to Chrome Web Store
      if: "!inputs.dry-run && env.CWS_UPLOAD == 'true' && env.IS_PRERELEASE == 'false'"
      env:
        CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
        CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
        CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        CWS_EXTENSION_ID: ${{ inputs.cws-extension-id }}
      run: |
        if [[ -z "$CWS_CLIENT_ID" || -z "$CWS_CLIENT_SECRET" || -z "$CWS_REFRESH_TOKEN" ]]; then
          echo "Chrome Web Store credentials not configured. Skipping submission."
          exit 0
        fi
        chrome-webstore-upload upload \
          --source "dist/chrome/${EXT_NAME}-chrome-v${VERSION}.zip" \
          --extension-id "$CWS_EXTENSION_ID" \
          --client-id "$CWS_CLIENT_ID" \
          --client-secret "$CWS_CLIENT_SECRET" \
          --refresh-token "$CWS_REFRESH_TOKEN"

    - name: Create Release with Assets
      if: "!inputs.dry-run && (github.event_name == 'push' || inputs.create-release)"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        SIGNED: ${{ steps.get_firefox_artifact.outputs.signed }}
        FIREFOX_ARTIFACT: ${{ steps.get_firefox_artifact.outputs.filepath }}
        DISPLAY_NAME: ${{ inputs.extension-display-name }}
        DESCRIPTION: ${{ inputs.extension-description }}
        AMO_URL: ${{ inputs.amo-url }}
        ISSUES_URL: ${{ inputs.issues-url }}
        FF_MIN: ${{ inputs.firefox-min-version }}
        CHROME_ENABLED: ${{ inputs.chrome-enabled }}
        CHROME_MIN: ${{ inputs.chrome-min-version }}
        PERMISSIONS: ${{ inputs.permissions-description }}
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.ref_name }}
      run: |
        # Use appropriate source path and extension
        if [ "$SIGNED" == "amo" ]; then
          cp "$FIREFOX_ARTIFACT" "dist/${EXT_NAME}-firefox-v${VERSION}-amo.xpi"
          xpi_file="dist/${EXT_NAME}-firefox-v${VERSION}-amo.xpi"
        elif [ "$SIGNED" == "true" ]; then
          cp "$FIREFOX_ARTIFACT" "dist/${EXT_NAME}-firefox-v${VERSION}-signed.xpi"
          xpi_file="dist/${EXT_NAME}-firefox-v${VERSION}-signed.xpi"
        else
          mv "$FIREFOX_ARTIFACT" "dist/${EXT_NAME}-firefox-v${VERSION}.xpi"
          xpi_file="dist/${EXT_NAME}-firefox-v${VERSION}.xpi"
        fi

        # Create release notes file
        cat > release_notes.md << NOTES_EOF
        # ${DISPLAY_NAME} v${VERSION}

        ${DESCRIPTION}

        ## Firefox Installation

        NOTES_EOF

        # Add appropriate installation instructions based on signing status
        if [ "$SIGNED" == "amo" ]; then
          {
            echo "**This release has been submitted to addons.mozilla.org for public distribution!**"
            echo ""
            echo "The extension will be available on AMO after review. In the meantime, you can:"
            echo "1. Download the \`.xpi\` file below under the **Assets** section for immediate installation"
            if [ -n "$AMO_URL" ]; then
              echo "2. Wait for it to appear on [the ${DISPLAY_NAME} page at addons.mozilla.org](${AMO_URL})"
            fi
            echo ""
          } >> release_notes.md
        elif [ "$SIGNED" == "true" ]; then
          cat >> release_notes.md << 'NOTES_EOF'
        **This release is signed by Mozilla and can be installed directly.**

        To install the extension:
        1. In the **Assets** section below, select the `.xpi` file.
        2. You should receive a Firefox prompt to add the extension; select "Continue to Installation"

        Alternatively, you can install the extension manually:
        1. Download the `.xpi` file link in the **Assets** section below
        2. Open the file with Firefox or drag it into a Firefox window
        3. Click "Add" when prompted

        NOTES_EOF
        else
          cat >> release_notes.md << 'NOTES_EOF'
        **This is an unsigned build. Installation options:**

        **Option 1: Firefox Developer Edition or Nightly**
        1. In Firefox Developer/Nightly, go to `about:config`
        2. Set `xpinstall.signatures.required` to `false`
        3. Download and install the `.xpi` file normally

        **Option 2: Temporary Installation (Regular Firefox)**
        1. Right-click the `.xpi` file link below and select "Save Link As" to download the extension (if you click the link, Firefox will try to install it which will be blocked because it's unsigned)
        2. Go to [about:debugging - "This Firefox"](about:debugging#/runtime/this-firefox)
        3. Click "Load Temporary Add-on..."
        4. Select the `.xpi` file you downloaded in Step 1

        NOTES_EOF
        fi

        # Add Chrome installation instructions if chrome-enabled
        if [ "$CHROME_ENABLED" == "true" ]; then
          cat >> release_notes.md << 'NOTES_EOF'

        ## Chrome Installation

        1. Download the `.zip` file from the **Assets** section below
        2. Unzip to a folder on your computer
        3. Open `chrome://extensions/`
        4. Enable "Developer mode" (toggle in top right)
        5. Click "Load unpacked" and select the unzipped folder

        NOTES_EOF
        fi

        # Add pre-release notice if applicable
        if [ "$IS_PRERELEASE" == "true" ]; then
          cat >> release_notes.md << NOTES_EOF

        ---

        **Pre-release Version**

        This is a pre-release version for testing new features.
        - May contain bugs or incomplete features
        - Will auto-update to stable version when released
        - Please report issues at ${ISSUES_URL}

        NOTES_EOF
        fi

        CHANGELOG=$(cat dist/changelog.md)

        cat >> release_notes.md << NOTES_EOF

        ## What's New
        ${CHANGELOG}

        ---

        **Firefox Requirements:** Version ${FF_MIN}
        NOTES_EOF

        if [ "$CHROME_ENABLED" == "true" ]; then
          echo "**Chrome Requirements:** Version ${CHROME_MIN}" >> release_notes.md
        fi

        cat >> release_notes.md << NOTES_EOF
        **Permissions:** ${PERMISSIONS}
        NOTES_EOF

        # Determine release flags based on type
        if [[ "$IS_PRERELEASE" == "true" ]]; then
          RELEASE_FLAGS="--prerelease"
          RELEASE_TITLE="${DISPLAY_NAME} v${VERSION} (Pre-release)"
        else
          RELEASE_FLAGS=""
          RELEASE_TITLE="${DISPLAY_NAME} v${VERSION}"
        fi

        # Collect release assets
        ASSETS=("$xpi_file")
        chrome_zip="dist/chrome/${EXT_NAME}-chrome-v${VERSION}.zip"
        if [ "$CHROME_ENABLED" == "true" ] && [ -f "$chrome_zip" ]; then
          ASSETS+=("$chrome_zip")
        fi

        # Create release with assets using GitHub CLI
        if [[ "$EVENT" == "push" ]]; then
          gh release create "$TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            $RELEASE_FLAGS \
            "${ASSETS[@]}"
        else
          gh release create "v${VERSION}-manual-$(date +%Y%m%d%H%M%S)" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE (Manual Build)" \
            --notes-file release_notes.md \
            --prerelease \
            "${ASSETS[@]}"
        fi

    - name: Build Summary
      if: "!inputs.dry-run"
      env:
        SIGNED: ${{ steps.get_firefox_artifact.outputs.signed }}
        CHROME_ENABLED: ${{ inputs.chrome-enabled }}
        RELEASED: ${{ github.event_name == 'push' || inputs.create-release }}
      run: |
        echo "Build completed for v${VERSION}!"

        # Firefox summary
        if [ "$SIGNED" == "amo" ]; then
          echo "Firefox Asset: ${EXT_NAME}-firefox-v${VERSION}-amo.xpi (Submitted to AMO)"
          echo "AMO Status: Submitted for review on addons.mozilla.org"
        elif [ "$SIGNED" == "true" ]; then
          echo "Firefox Asset: ${EXT_NAME}-firefox-v${VERSION}-signed.xpi (SIGNED for self-distribution)"
        else
          echo "Firefox Asset: ${EXT_NAME}-firefox-v${VERSION}.xpi (unsigned)"
        fi

        # Chrome summary
        if [ "$CHROME_ENABLED" == "true" ]; then
          echo "Chrome Asset: ${EXT_NAME}-chrome-v${VERSION}.zip"
        fi

        if [[ "$RELEASED" == "true" ]]; then
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        else
          echo "Build artifacts available in workflow run"
        fi

    - name: Upload signed artifacts (manual builds)
      if: github.event_name == 'workflow_dispatch' && !inputs.create-release && !inputs.dry-run
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: extension-v${{ needs.build.outputs.version }}-signed
        path: |
          dist-signed/*.xpi
          dist-amo/*.xpi
        retention-days: 30
